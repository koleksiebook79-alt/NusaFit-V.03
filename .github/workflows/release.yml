name: NusaFit Release APK

on:
  workflow_dispatch:
  push:
    branches: ["main", "master"]

permissions:
  contents: read

concurrency:
  group: nusafit-release
  cancel-in-progress: true

jobs:
  release:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
          cache: gradle

      - name: Set up Gradle 8.13
        uses: gradle/actions/setup-gradle@v5
        with:
          gradle-version: "8.13"

      - name: Verify Android project
        shell: bash
        run: |
          set -euo pipefail
          test -f settings.gradle.kts
          test -f build.gradle.kts
          test -f app/build.gradle.kts
          echo "Firebase configuration is not required."

      - name: Build release APK
        shell: bash
        run: |
          set -euo pipefail
          gradle --no-daemon --stacktrace --warning-mode all assembleRelease

      - name: Verify release APK
        shell: bash
        run: |
          set -euo pipefail
          test -n "$(find app/build/outputs/apk/release -type f -name "*.apk" -print -quit)"
          ls -lh app/build/outputs/apk/release/*.apk

      - name: Upload release APK
        uses: actions/upload-artifact@v4
        with:
          name: NusaFit-release-apk
          path: app/build/outputs/apk/release/*.apk
          if-no-files-found: error
          retention-days: 30
